<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">UniPIM overview</title><desc id="d">Left: index-based sparse PIM stores large index metadata and gives each DRAM bank a different amount of work, so all banks wait for the slowest. Right: UniPIM stores a small bitmap and datapath-aligned 32-byte blocks with equal work per bank, so banks finish together.</desc>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#14122b} .h{font-size:17px;font-weight:700} .s{font-size:12.5px;fill:#4b4866} .xs{font-size:11px;fill:#7a7792} .b{font-weight:700}</style>
<rect width="760" height="400" fill="#ffffff"/>
<rect x="16" y="16" width="356" height="368" rx="14" fill="#f6f5fb" stroke="#e4e2ef"/><rect x="16" y="16" width="356" height="4" rx="2" fill="#b9b5cc"/><text x="34" y="48" class="h">Index-based sparse PIM</text><text x="34" y="68" class="s">CSR/COO metadata, uneven work per bank</text><rect x="388" y="16" width="356" height="368" rx="14" fill="#f6f5fb" stroke="#e4e2ef"/><rect x="388" y="16" width="356" height="4" rx="2" fill="#6d50e8"/><text x="406" y="48" class="h">UniPIM</text><text x="406" y="68" class="s">Bitmap + 32-byte blocks, all-bank balanced</text><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f2b880"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d98a3d" stroke-width="2"/></pattern></defs><rect x="44" y="295" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="44" y="272" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="44" y="249" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="44" y="226" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="44" y="203" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><rect x="44" y="180" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><text x="73" y="338" class="xs" text-anchor="middle">Bank 0</text><rect x="122" y="295" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="122" y="272" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="122" y="249" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><rect x="122" y="226" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><text x="151" y="338" class="xs" text-anchor="middle">Bank 1</text><rect x="200" y="295" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="200" y="272" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="200" y="249" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="200" y="226" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="200" y="203" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="200" y="180" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><rect x="200" y="157" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><rect x="200" y="134" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><text x="229" y="338" class="xs" text-anchor="middle">Bank 2</text><rect x="278" y="295" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="278" y="272" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="278" y="249" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="278" y="226" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><rect x="278" y="203" width="58" height="20" rx="4" fill="url(#hatch)" stroke="#d98a3d" stroke-opacity=".6"/><text x="307" y="338" class="xs" text-anchor="middle">Bank 3</text><line x1="34" x2="354" y1="128" y2="128" stroke="#d9480f" stroke-dasharray="5 4" stroke-width="1.5"/><text x="354" y="122" class="xs" text-anchor="end" style="fill:#c2410c;font-weight:700">all banks wait for the slowest</text><rect x="44" y="352" width="14" height="12" rx="3" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><text x="64" y="362" class="xs">weights</text><rect x="130" y="352" width="14" height="12" rx="3" fill="url(#hatch)"/><text x="150" y="362" class="xs">index m