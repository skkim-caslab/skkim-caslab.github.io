650" y="295" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="650" y="272" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="650" y="249" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="650" y="226" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="650" y="203" width="58" height="20" rx="4" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><rect x="650" y="192" width="58" height="8" rx="2" fill="#6d50e8"/><text x="679" y="338" class="xs" text-anchor="middle">Bank 3</text><line x1="406" x2="726" y1="186" y2="186" stroke="#6d50e8" stroke-dasharray="5 4" stroke-width="1.5"/><text x="726" y="180" class="xs" text-anchor="end" style="fill:#6d50e8;font-weight:700">banks finish together</text><rect x="416" y="356" width="14" height="5" rx="1" fill="#6d50e8"/><text x="436" y="362" class="xs">bitmap</text><rect x="490" y="352" width="14" height="12" rx="3" fill="#cfc5fb" stroke="#6d50e8" stroke-opacity=".5"/><text x="510" y="362" class="xs">32-byte weight / KV blocks</text>
