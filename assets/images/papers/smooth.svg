<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">SMOOTH overview</title><desc id="d">Two DRAM bandwidth timelines. With static compiler tiling, bandwidth is idle during compute phases and saturated during weight streaming. With SMOOTH, upcoming weights are preloaded into the idle bandwidth using fine-grained scratchpad blocks freed by early reclamation, so the streaming phases shrink and decoding finishes earlier.</desc>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#14122b} .h{font-size:17px;font-weight:700} .s{font-size:12.5px;fill:#4b4866} .xs{font-size:11px;fill:#7a7792} .b{font-weight:700}</style>
<rect width="760" height="400" fill="#ffffff"/>
<rect x="16" y="16" width="728" height="368" rx="14" fill="#f6f5fb" stroke="#e4e2ef"/><rect x="16" y="16" width="728" height="4" rx="2" fill="#db2777"/><text x="34" y="48" class="h">DRAM bandwidth during on-device decoding</text><text x="34" y="68" class="s">Decoding alternates compute-bound and I/O-bound (GEMV) phases on a mobile NPU</text><defs><pattern id="pre" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f9c6dc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#db2777" stroke-width="1.6" stroke-opacity=".7"/></pattern></defs><text x="34" y="128" class="b" style="font-size:14px">Static tiling</text><text x="34" y="146" class="xs">compile-time plan</text><line x1="150" x2="728" y1="174" y2="174" stroke="#7a7792" stroke-opacity=".5"/><rect x="150" y="162" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="212" y="96" width="92" height="78" fill="#9b97b3" fill-opacity=".85"/><rect x="304" y="162" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="366" y="96" width="92" height="78" fill="#9b97b3" fill-opacity=".85"/><rect x="458" y="162" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="520" y="96" width="92" height="78" fill="#9b97b3" fill-opacity=".85"/><path d="M154 152 h54" stroke="#7a7792" fill="none"/><text x="181" y="144" class="xs" text-anchor="middle">idle</text><text x="34" y="264" class="b" style="font-size:14px">SMOOTH</text><text x="34" y="282" class="xs">runtime, block-level</text><line x1="150" x2="728" y1="310" y2="310" stroke="#7a7792" stroke-opacity=".5"/><rect x="150" y="298" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="150" y="244" width="62" height="54" fill="url(#pre)"/><rect x="212" y="232" width="42" height="78" fill="#9b97b3" fill-opacity=".85"/><rect x="254" y="298" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="254" y="244" width="62" height="54" fill="url(#pre)"/><rect x="316" y="232" width="42" height="78" fill="#9b97b3" fill-opacity=".85"/><rect x="358" y="298" width="62" height="12" fill="#e4e2ef" stroke="#cfcce0"/><rect x="358" y="244" width="62" height="54" fill="url(#pre)"/><rect x="420" y="232" width="42" height="78" fill="#9b97b3" fill-opacity=".85"/><line x1="612" x2="612" y1="90" y2="180" stroke="#14122b" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="462" x2="462" y1="226" y2="316" stroke="#14122b" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M606 300 L470 300" stroke="#db2777" stroke-width="2" fill="none" marker-end="url(#ar)"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#db2777"/></marker></defs><text x="537" y="292" class="xs" text-anchor="middle" style="fill:#db2777;font-weight:700">shorter decode</text><rect x="150" y="352" width="14" height="12" rx="2" fill="#e4e2ef" stroke="#cfcce0"/><text x="170" y="362" class="xs">compute phase</text><rect x="270" y="352" width="14" height="12" rx="2" fill="#9b97b3"/><text x="290" y="362" class="xs">weight streaming (GEMV)</text><rect x="440" y="352" width="14" height="12" rx="2" fill="url(#pre)"/><text x="460" y="362" class="xs">preload into idle bandwidth, freed by early reclamation</text>
</svg>
