<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">S-ANNS overview</title><desc id="d">Left: a bank-level PIM reads a 32-bit float per dimension and multiplies it by the query in an FP32 multiplier. Right: S-ANNS stores each dimension offline as a few signed powers of two, for example 0.4375 as plus 2 to the minus 1 minus 2 to the minus 4, so the processing element only shifts the query and adds, with no multiplier or lookup table.</desc>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#14122b} .h{font-size:17px;font-weight:700} .s{font-size:12.5px;fill:#4b4866} .xs{font-size:11px;fill:#7a7792} .b{font-weight:700}</style>
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="a7a7792" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7a7792"/></marker><marker id="a0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0d9488"/></marker></defs><rect x="16" y="16" width="356" height="368" rx="14" fill="#f6f5fb" stroke="#e4e2ef"/><rect x="16" y="16" width="356" height="4" rx="2" fill="#b9b5cc"/><text x="34" y="48" class="h">Bank-level PIM with FP32 MAC</text><text x="34" y="68" class="s">Float32 vectors: 4 bytes per dimension</text><rect x="388" y="16" width="356" height="368" rx="14" fill="#f6f5fb" stroke="#e4e2ef"/><rect x="388" y="16" width="356" height="4" rx="2" fill="#0d9488"/><text x="406" y="48" class="h">S-ANNS shift PE</text><text x="406" y="68" class="s">Power-of-Two code stored in DRAM</text><rect x="40" y="92" width="308" height="54" rx="9" fill="#fff" stroke="#b9b5cc"/><text x="194.0" y="119.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">DRAM row: v = 0.4375</text><text x="194.0" y="136.0" class="xs" text-anchor="middle">float32 · 32 bits per dimension</text><path d="M194 146 L194 186" stroke="#7a7792" stroke-width="1.6" fill="none" marker-end="url(#a7a7792)"/><text x="70" y="172" class="xs">query q</text><path d="M70 178 L118 210" stroke="#7a7792" stroke-width="1.6" fill="none" marker-end="url(#a7a7792)"/><rect x="110" y="188" width="168" height="70" rx="9" fill="#ecebf3" stroke="#b9b5cc"/><text x="194.0" y="223.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">FP32 multiplier</text><text x="194.0" y="240.0" class="xs" text-anchor="middle">q × v</text><path d="M194 258 L194 290" stroke="#7a7792" stroke-width="1.6" fill="none" marker-end="url(#a7a7792)"/><rect x="134" y="292" width="120" height="44" rx="9" fill="#fff" stroke="#b9b5cc"/><text x="194.0" y="318.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">Σ distance</text><rect x="412" y="92" width="308" height="54" rx="9" fill="#fff" stroke="#0d9488"/><text x="566.0" y="119.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">DRAM row: v ≈ +2⁻¹ − 2⁻⁴</text><text x="566.0" y="136.0" class="xs" text-anchor="middle">S signed shifts per dimension (offline)</text><path d="M520 146 L500 192" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><path d="M612 146 L632 192" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><text x="566" y="214" class="xs" text-anchor="middle">query q</text><path d="M548 210 L532 210" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><path d="M584 210 L600 210" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><rect x="440" y="192" width="92" height="40" rx="9" fill="#c7ece8" stroke="#0d9488"/><text x="486.0" y="216.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">q ≫ 1</text><rect x="600" y="192" width="92" height="40" rx="9" fill="#c7ece8" stroke="#0d9488"/><text x="646.0" y="216.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">q ≫ 4</text><path d="M486 232 L552 266" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><path d="M646 232 L580 266" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><circle cx="566" cy="276" r="15" fill="#c7ece8" stroke="#0d9488"/><text x="566" y="281" text-anchor="middle" class="b" style="font-size:15px">+ −</text><path d="M566 291 L566 300" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a0d9488)"/><rect x="506" y="302" width="120" height="40" rx="9" fill="#fff" stroke="#0d9488"/><text x="566.0" y="326.0" class="s" text-anchor="middle" style="fill:#14122b;font-weight:650">Σ distance</text><text x="566" y="366" class="xs" text-anchor="middle" style="fill:#0d9488;font-weight:700">no multiplier, no lookup table</text>
</svg>
