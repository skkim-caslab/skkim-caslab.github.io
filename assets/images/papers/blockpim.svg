<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">BlockPIM overview</title><desc id="d">Left: unstructured pruning leaves scattered non-zeros that need per-element column indices and row pointers, which outweigh low-bit INT8 values and require a sparse engine. Right: BlockPIM prunes whole 32-byte blocks, keeps one bitmap bit per block, stores non-zero blocks contiguously, and runs them on the standard dense MAC pipeline.</desc>
